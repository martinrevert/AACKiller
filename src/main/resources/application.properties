spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/aac2ac3;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}

# Keep JPA bootstrap deterministic in native mode.
spring.jpa.open-in-view=false

# Optional: enable h2 console when running locally. Use SPRING_H2_CONSOLE_ENABLED=true to enable.
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Logging for datasource initialization
logging.level.org.springframework.jdbc=INFO

# Index reconcile (automatic discovery) settings
# Enable/disable the scheduled incremental reconcile (true/false)
index.reconcile.enabled=${INDEX_RECONCILE_ENABLED:true}
# Interval between reconcile runs in milliseconds (default 5 minutes)
index.reconcile.intervalMs=${INDEX_RECONCILE_INTERVAL_MS:300000}
# Initial delay before first reconcile run in milliseconds (default 15 seconds)
index.reconcile.initialDelayMs=${INDEX_RECONCILE_INITIAL_DELAY_MS:15000}

# Watcher configuration (already present defaults shown here for reference)
index.watchEnabled=${INDEX_WATCH_ENABLED:true}
index.watch.threads=${INDEX_WATCH_THREADS:2}
index.watch.probeRetries=${INDEX_WATCH_PROBE_RETRIES:3}
index.watch.probeRetryDelayMs=${INDEX_WATCH_PROBE_RETRY_DELAY_MS:2000}