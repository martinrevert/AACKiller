<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Index Contents — AAC→AC3</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-bar">
    <div class="app-bar-inner container">
      <div class="app-title"><a href="/">AAC→AC3</a></div>
      <nav class="app-nav">
        <a href="/">Dashboard</a>
        <a href="/index-contents.html">Index</a>
      </nav>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>Index Contents</h1>
      <p class="muted">Browse the indexed jobs and their metadata</p>
    </header>

    <section>
      <div class="btn-row">
        <button id="clearIndexBtn" class="btn danger">Clear Index</button>
      </div>
      <div id="indexStatusPanel" class="mini-status" style="margin-top:10px">
        <div><strong>Worker:</strong> <span id="idxWorkerStatus">unknown</span></div>
        <div><strong>SSE:</strong> <span id="idxSseStatus">disconnected</span></div>
        <div><strong>Last event:</strong> <span id="idxLastEvent">none</span></div>
        <div><strong>Updated:</strong> <span id="idxLastAt">-</span></div>
      </div>
      <div id="indexArea" style="margin-top:12px"></div>
    </section>

    <footer>
      <small class="muted">Index view — shows all jobs stored in the DB</small>
    </footer>
  </div>

  <script>
    const IDX_UI_STATE_KEY = 'aac2ac3.dashboard.uiState.v1';

    const idxState = {
      workerStatus: 'unknown',
      sseConnected: false,
      lastEvent: 'none',
      lastAt: 0
    };

    function idxNormalizeStatus(s){ return String(s || '').trim().toLowerCase(); }

    function idxSetText(id, value){
      const n = document.getElementById(id);
      if(!n) return;
      n.textContent = String(value == null ? '' : value);
    }

    function idxFormatTime(ms){
      if(!ms) return '-';
      try { return new Date(Number(ms)).toLocaleTimeString(); }
      catch(e){ return '-'; }
    }

    function idxLoadPersistedState(){
      try{
        const raw = localStorage.getItem(IDX_UI_STATE_KEY);
        if(!raw) return;
        const parsed = JSON.parse(raw);
        if(parsed && typeof parsed === 'object'){
          if(parsed.workerStatus) idxState.workerStatus = parsed.workerStatus;
          if(typeof parsed.sseConnected === 'boolean') idxState.sseConnected = parsed.sseConnected;
          if(parsed.lastEventText) idxState.lastEvent = parsed.lastEventText;
          if(Number.isFinite(parsed.lastEventAt)) idxState.lastAt = Number(parsed.lastEventAt);
        }
      }catch(e){ console.warn('idx persisted state load failed', e); }
    }

    function idxSaveState(){
      try{
        const raw = localStorage.getItem(IDX_UI_STATE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        parsed.workerStatus = idxState.workerStatus;
        parsed.sseConnected = idxState.sseConnected;
        parsed.lastEventText = idxState.lastEvent;
        parsed.lastEventAt = idxState.lastAt;
        localStorage.setItem(IDX_UI_STATE_KEY, JSON.stringify(parsed));
      }catch(e){ console.warn('idx persisted state save failed', e); }
    }

    function idxRenderStatus(){
      idxSetText('idxWorkerStatus', idxState.workerStatus);
      idxSetText('idxSseStatus', idxState.sseConnected ? 'connected' : 'disconnected');
      idxSetText('idxLastEvent', idxState.lastEvent || 'none');
      idxSetText('idxLastAt', idxFormatTime(idxState.lastAt));

      const sseNode = document.getElementById('idxSseStatus');
      if(sseNode){
        sseNode.classList.toggle('connected', idxState.sseConnected);
        sseNode.classList.toggle('disconnected', !idxState.sseConnected);
      }
      idxSaveState();
    }

    function idxMarkEvent(name){
      idxState.lastEvent = name || 'event';
      idxState.lastAt = Date.now();
      idxRenderStatus();
    }

    async function loadWorkerStatus(){
      try{
        const res = await fetch('/api/v1/control/scan-config');
        if(!res.ok) return;
        const body = await res.json();
        if(typeof body.workerRunning === 'boolean'){
          idxState.workerStatus = body.workerRunning ? 'running' : 'stopped';
          idxMarkEvent('scan-config-loaded');
        }
      }catch(e){
        console.warn('loadWorkerStatus failed', e);
      }
    }

    function setBusy(button, busy, busyText){
      if(!button) return;
      if(busy){
        if(!button.dataset.originalText) button.dataset.originalText = button.textContent || '';
        button.disabled = true;
        button.classList.add('is-loading');
        button.textContent = busyText || 'Working...';
        return;
      }
      button.disabled = false;
      button.classList.remove('is-loading');
      button.textContent = button.dataset.originalText || button.textContent || '';
    }

    function ensureToastHost(){
      let host = document.getElementById('toastHost');
      if(host) return host;
      host = document.createElement('div');
      host.id = 'toastHost';
      host.className = 'toast-host';
      document.body.appendChild(host);
      return host;
    }

    function showToast(msg, type='info'){
      const host = ensureToastHost();
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = String(msg || 'done');
      host.appendChild(t);
      window.setTimeout(()=>{
        t.classList.add('hide');
        window.setTimeout(()=>t.remove(), 260);
      }, 2600);
    }

    async function fetchJobs(){
      try{
        const res = await fetch('/api/v1/jobs');
        if(!res.ok) throw new Error('status '+res.status);
        return await res.json();
      }catch(e){ return {error:e.toString()} }
    }

    function formatDate(ms){ if(!ms) return ''; try{ return new Date(Number(ms)).toLocaleString(); }catch(e){ return String(ms) } }

    function renderTable(jobs){
      if(!Array.isArray(jobs) || jobs.length===0) return '<div class="muted">No jobs</div>';
      let html = '<div class="table-wrapper"><table><thead><tr><th>ID</th><th>File</th><th>Status</th><th>Retries</th><th>Created</th><th>Started</th><th>Finished</th><th>Logs</th></tr></thead><tbody>';
      for(const j of jobs){
        html += `<tr><td>${j.id||''}</td><td title="${(j.fileName||'').replace(/"/g,'&quot;')}">${(j.fileName||'')}</td><td>${(j.status||'')}</td><td>${(j.retryCount||0)}</td><td>${formatDate(j.createdAt)}</td><td>${formatDate(j.startedAt)}</td><td>${formatDate(j.finishedAt)}</td><td>${(j.logsPath||'')}</td></tr>`;
      }
      html += '</tbody></table></div>';
      return html;
    }

    let jobsCacheJson = '';
    let es = null;

    function updateFromArray(arr){
      const area = document.getElementById('indexArea');
      const newJson = JSON.stringify(arr || []);
      if(newJson === jobsCacheJson) return;
      jobsCacheJson = newJson;
      if(area) area.innerHTML = renderTable(arr);
    }

    function upsertJob(job){
      let arr = [];
      try{ arr = JSON.parse(jobsCacheJson || '[]'); }catch(e){ arr = []; }
      let found = false;
      for(let i=0;i<arr.length;i++){ if(arr[i].id === job.id){ arr[i] = job; found = true; break; } }
      if(!found) arr.push(job);
      updateFromArray(arr);
    }

    function deleteJobById(id){
      let arr = [];
      try{ arr = JSON.parse(jobsCacheJson || '[]'); }catch(e){ arr = []; }
      arr = arr.filter(j => j.id !== id);
      updateFromArray(arr);
    }

    function startSSE(){
      if(es) return;
      es = new EventSource('/api/v1/jobs/stream');
      idxState.sseConnected = true;
      idxMarkEvent('sse-connected');
      es.addEventListener('jobsSnapshot', ev => { try{ const data = JSON.parse(ev.data || '[]'); updateFromArray(data); }catch(e){ console.error(e); } });
      es.addEventListener('job', ev => { try{ const j = JSON.parse(ev.data); upsertJob(j); }catch(e){ console.error(e); } });
      es.addEventListener('jobDeleted', ev => { try{ deleteJobById(Number(ev.data)); }catch(e){ console.error(e); } });
      es.addEventListener('indexCleared', ev => {
        jobsCacheJson = '';
        const area = document.getElementById('indexArea');
        if(area) area.innerHTML = '<div class="muted">No jobs</div>';
        idxMarkEvent('index-cleared');
      });
      es.addEventListener('workerStatus', ev => {
        idxState.workerStatus = ev.data || 'unknown';
        idxMarkEvent(`worker-${idxNormalizeStatus(ev.data || 'unknown')}`);
      });
      es.onerror = (err) => {
        idxState.sseConnected = false;
        idxMarkEvent('sse-disconnected');
        try{ es.close(); }catch(e){};
        es = null;
        setTimeout(startSSE, 3000);
      };
    }

    document.addEventListener('DOMContentLoaded',()=>{
      idxLoadPersistedState();
      idxRenderStatus();
      loadWorkerStatus();

      const clearBtn = document.getElementById('clearIndexBtn');
      if(clearBtn) clearBtn.addEventListener('click', async ()=>{
        if(!confirm('Clear index and delete all jobs?')) return;
        setBusy(clearBtn, true, 'Clearing...');
        try{
          const res = await fetch('/api/v1/control/clear-index',{method:'POST'});
          if(!res.ok){
            showToast(`Clear index failed (${res.status})`, 'error');
            return;
          }
          showToast('Index cleared', 'success');
          // server will push indexCleared + snapshot
        } finally {
          setBusy(clearBtn, false);
        }
      });
      startSSE();
    });
  </script>
</body>
</html>
