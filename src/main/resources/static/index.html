<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AAC→AC3 Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-bar">
    <div class="app-bar-inner container">
      <div class="app-title"><a href="/">AAC→AC3</a></div>
      <nav class="app-nav">
        <a href="/">Dashboard</a>
        <a href="/index-contents.html">Index</a>
      </nav>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>AAC→AC3 Dashboard</h1>
      <p class="muted">Quick controls and info for the service</p>
    </header>

    <section class="controls">
      <h2>Controls</h2>
      <div class="btn-row">
        <button id="startBtn" class="btn primary">Start Worker</button>
        <button id="stopBtn" class="btn">Stop Worker</button>
        <button id="clearBtn" class="btn danger">Clear Index</button>
      </div>
      <div id="statusArea" class="status">Status: <span id="statusText">unknown</span></div>

      <div id="scanConfigSection" class="scan-config hidden">
        <h3>Scan Directory (Worker Stopped)</h3>
        <div class="form-row">
          <label for="scanMode">Mode</label>
          <select id="scanMode">
            <option value="local">Local Filesystem</option>
            <option value="smb">Samba (SMB)</option>
          </select>
        </div>

        <div id="localPathArea" class="form-row">
          <label for="localPathInput">Local Path</label>
          <input id="localPathInput" type="text" placeholder="/mnt/media" />
        </div>

        <div id="smbArea" class="hidden">
          <div class="form-row">
            <label for="smbHostInput">SMB Host</label>
            <input id="smbHostInput" type="text" placeholder="192.168.1.20" />
          </div>
          <div class="form-row">
            <label for="smbShareInput">Share</label>
            <input id="smbShareInput" type="text" placeholder="Media" />
          </div>
          <div class="form-row">
            <label for="smbPathInput">Directory</label>
            <input id="smbPathInput" type="text" placeholder="Movies/Action" />
          </div>
          <div class="form-row">
            <label for="smbUserInput">Username</label>
            <input id="smbUserInput" type="text" placeholder="smb-user" />
          </div>
          <div class="form-row">
            <label for="smbPassInput">Password</label>
            <input id="smbPassInput" type="password" placeholder="password" />
          </div>
          <div class="form-row">
            <label for="smbDomainInput">Domain</label>
            <input id="smbDomainInput" type="text" placeholder="WORKGROUP (optional)" />
          </div>
          <div class="btn-row">
            <button id="browseSmbBtn" class="btn">Browse SMB Directories</button>
            <button id="testSmbBtn" class="btn">Test SMB Connection</button>
          </div>
          <div id="smbBrowseArea" class="muted"></div>
          <div id="smbTestArea" class="muted"></div>
        </div>

        <div class="btn-row">
          <button id="saveScanBtn" class="btn primary">Save Scan Directory</button>
        </div>
        <small class="muted">Saving a new scan directory automatically clears the index.</small>
      </div>
    </section>

    <section class="info">
      <h2>Jobs</h2>
      <div id="jobsArea"></div>
    </section>


    <footer>
      <small>Hosted by the AAC→AC3 service. Make sure <code>ffmpeg</code> and <code>ffprobe</code> are on PATH.</small>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
